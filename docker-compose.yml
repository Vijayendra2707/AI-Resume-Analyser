version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: resume-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/resume-frontend
    container_name: resume-frontend

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - backend

    restart: unless-stopped